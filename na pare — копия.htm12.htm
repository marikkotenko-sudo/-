<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Анимация машины</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .car-container {
        position: relative; /* Позиционируем колёса */
        width: 200px;
        height: 150px;
        animation: drive-in 3s ease-out forwards; /* Анимация въезда */
      }

      .car-body {
        background-color: #ff6f5e; /* Красный цвет кузова */
        border-radius: 40% / 10%; /* Округлённый капот и багажник */
        height: 90%;
        width: 100%;
      }

      .wheel {
        background-color: black;
        border-radius: 50%; /* Колесо круглое */
        height: 30%;
        left: 15%;
        bottom: 0;
        position: absolute;
        width: 15%;
      }

      .rear-wheel { 
        right: 15%; /* Правое колесо */
        left: auto;
      }

      @keyframes drive-in {
        from {
          transform: translateX(-100vw);
        } /* Машина выезжает слева за экраном */
        
        to {
          transform: translateX(calc(100vw - 250px));
        } /* Останавливается за 50px до правого края (ширина машинки + отступ) */
      }
    </style>
  </head>
  <body>
    <!-- Минимальное количество элементов -->
    <div class="car-container">
      <div class="car-body"></div>
      <div class="wheel front-wheel"></div>
      <div class="wheel rear-wheel"></div>
    </div>
  </body>
</html>
